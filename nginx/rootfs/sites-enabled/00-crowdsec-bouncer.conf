# CrowdSec nginx bouncer (http context).
# Requires the LAPI + a bouncer config file (mounted at
# /etc/crowdsec/bouncers/crowdsec-nginx-bouncer.conf with API_URL + API_KEY).
# If either is missing or the LAPI is unreachable at startup, the bouncer
# disables itself (fail open) and nginx runs without enforcement rather than
# failing to start.

lua_package_path '/usr/local/lua/crowdsec/?.lua;;';
lua_shared_dict crowdsec_cache 50m;

init_by_lua_block {
    local ok, res, reason = pcall(function()
        local f = io.open("/etc/crowdsec/bouncers/crowdsec-nginx-bouncer.conf", "r")
        if f == nil then
            return nil, "bouncer configuration not found"
        end
        f:close()
        local cs = require "crowdsec"
        local ok2, err2 = cs.init("/etc/crowdsec/bouncers/crowdsec-nginx-bouncer.conf", "crowdsec-nginx-bouncer/v1.0.19")
        if ok2 == nil then
            return nil, "init failed: " .. tostring(err2)
        end
        return cs
    end)
    if not ok or res == nil then
        ngx.log(ngx.ERR, "[Crowdsec] bouncer disabled (fail open): " .. tostring(reason or res))
        crowdsec_disabled = true
        return
    end
    cs = res
    ngx.log(ngx.ALERT, "[Crowdsec] Initialisation done")
}

access_by_lua_block {
    if crowdsec_disabled then
        return
    end
    cs.Allow(ngx.var.remote_addr)
}
