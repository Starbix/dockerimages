# ModSecurity v3 engine configuration
# DetectionOnly = log matches without blocking. Set to "On" to enforce.

SecRuleEngine DetectionOnly

# Request body
SecRequestBodyAccess On
SecRequestBodyLimit 26843545600
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# Response body inspection (disabled by default)
SecResponseBodyAccess Off

# Temp/data dirs
SecTmpDir /tmp
SecDataDir /tmp

# Audit log: Serial + JSON, ready for Grafana Loki / Alloy parsing
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /nginx/logs/modsec_audit.log

# Misc
SecArgumentSeparator &
SecCookieFormat 0
SecUnicodeMapFile /nginx/conf/modsecurity/unicode.mapping 20127
SecStatusEngine Off
