# ModSecurity v3 engine configuration - MINIMAL defaults only.
# Site-specific tuning (engine mode, exclusions) belongs in
# /nginx/conf/modsecurity/local/*.conf which is bind-mounted from the host

SecRuleEngine DetectionOnly

# Request body
SecRequestBodyAccess On
SecRequestBodyLimit 26843545600
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# Response body inspection (disabled by default)
SecResponseBodyAccess Off

# Temp/data dirs
SecTmpDir /tmp
SecDataDir /tmp

# Audit log: Serial + JSON, ready for Grafana Loki / Alloy parsing.
# Engine On (not RelevantOnly) so every request is audited during tuning.
# Request/response bodies are excluded from audit parts (no "I"/"J"): a large
# upload serialized into the serial audit log stalls the writer and freezes
# all WAF logging. Rule id + message + headers carry the tuning signal.
SecAuditEngine On
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABDEFHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /nginx/logs/modsec_audit.log

# Misc
SecArgumentSeparator &
SecCookieFormat 0
SecUnicodeMapFile /nginx/conf/modsecurity/unicode.mapping 20127
SecStatusEngine Off
