# Include chain for the ModSecurity nginx connector (modsecurity_rules_file)
Include /nginx/conf/modsecurity/modsecurity.conf
Include /nginx/conf/modsecurity/crs-setup.conf

# Site-local tuning AND rule plugins, bind-mounted from the host (appdata).
# Plain *.conf files load BEFORE the CRS rules (engine mode, exclusions,
# tx overrides, e.g. 40-nextcloud-*.conf); *-after-crs.conf files load AFTER.
Include /nginx/conf/modsecurity/local/*.conf

Include /nginx/conf/modsecurity/crs/rules/*.conf

Include /nginx/conf/modsecurity/local/*-after-crs.conf
